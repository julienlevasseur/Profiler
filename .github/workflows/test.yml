on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - name: Install Go
      uses: actions/setup-go@v5
      with:
        # Single source of truth: the `go` directive in go.mod.
        go-version-file: go.mod
    - name: Vet
      run: go vet ./...
    - name: Test
      run: go test ./...
